services:
  postgres:
    image: postgres:16-alpine
    container_name: bihar360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bihar360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bihar360}
      POSTGRES_DB: ${POSTGRES_DB:-bihar360}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bihar360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bihar360} -d ${POSTGRES_DB:-bihar360}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  bihar360_pgdata:
    name: bihar360_pgdata
